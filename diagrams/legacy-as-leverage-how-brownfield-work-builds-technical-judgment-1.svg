<svg width="720" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="lt-title lt-desc"><title id="lt-title">The long tail</title><desc id="lt-desc">A short design and build phase followed by a long operate, evolve and adapt phase, with a feedback arrow from experience back to judgment at design time.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c57a5"/></marker></defs>
<path d="M40 70 C 220 6, 520 6, 690 70" fill="none" stroke="#1c57a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)" transform="translate(720,0) scale(-1,1)"/>
<text x="360" y="58" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#0d2f63">EXPERIENCE → JUDGMENT</text>
<line x1="40" y1="110" x2="150" y2="110" stroke="#15191f" stroke-width="4"/>
<line x1="150" y1="110" x2="690" y2="110" stroke="#1c57a5" stroke-width="4"/>
<g stroke="#5a6370" stroke-width="1.5">
<line x1="210" y1="110" x2="200" y2="92"/><line x1="270" y1="110" x2="282" y2="94"/><line x1="330" y1="110" x2="322" y2="128"/>
<line x1="390" y1="110" x2="402" y2="90"/><line x1="450" y1="110" x2="440" y2="130"/><line x1="510" y1="110" x2="522" y2="92"/>
<line x1="570" y1="110" x2="560" y2="88"/><line x1="630" y1="110" x2="642" y2="128"/>
</g>
<circle cx="40" cy="110" r="6" fill="#fff" stroke="#15191f" stroke-width="2"/>
<line x1="40" y1="140" x2="150" y2="140" stroke="#d8dde4"/><line x1="150" y1="140" x2="690" y2="140" stroke="#d8dde4"/>
<text x="95" y="160" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#15191f">Design + build</text>
<text x="420" y="160" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#15191f">Operate · evolve · adapt (the long tail)</text>
<text x="420" y="182" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#5a6370">often run by people who didn't build it</text>
</svg>