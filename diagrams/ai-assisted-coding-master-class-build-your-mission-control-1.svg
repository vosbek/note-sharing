<svg width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="lad-t lad-d" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
<title id="lad-t">Dev Bali's testing ladder</title>
<desc id="lad-d">A decision ladder. Start: precise custom business logic? If no, AI review bots are good enough. If yes, eight rungs from cheapest to most rigorous: types and lint on every PR; contracts at service boundaries; end to end for user flows; property-based tests for rules that hold for every input; mutation testing to check the tests; sanitizers and fuzzing where code can crash; symbolic and concolic execution for small critical sections; formal verification where code cannot go wrong. Rungs one, two and six are tagged super low effort; rungs four to eight are tagged agents transforming it.</desc>
<rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
<rect x="20" y="16" width="250" height="40" rx="3" fill="#15191f"/>
<text x="145" y="41" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Precise custom business logic?</text>
<line x1="270" y1="36" x2="330" y2="36" stroke="#5a6370" stroke-width="1.5"/>
<text x="300" y="30" text-anchor="middle" font-size="12" fill="#5a6370">No</text>
<rect x="330" y="16" width="250" height="40" rx="3" fill="#ffffff" stroke="#5a6370" stroke-width="1.5"/>
<text x="455" y="41" text-anchor="middle" font-size="14" fill="#15191f">AI review bots are good enough</text>
<text x="30" y="80" font-size="12" font-weight="600" fill="#1c57a5">Yes: ask each question in turn</text>
<g font-size="13">
<g transform="translate(20,92)"><rect width="720" height="38" fill="#e8eff9"/><text x="12" y="24" fill="#5a6370">Always, every PR</text><text x="250" y="24" font-weight="600" fill="#15191f">Types and lint</text><rect x="560" y="10" width="140" height="18" rx="9" fill="#ffffff" stroke="#1c57a5"/><text x="630" y="23" text-anchor="middle" font-size="11" fill="#0d2f63">super low effort</text></g>
<g transform="translate(20,134)"><rect width="720" height="38" fill="#e8eff9"/><text x="12" y="24" fill="#5a6370">Crosses a service boundary?</text><text x="250" y="24" font-weight="600" fill="#15191f">Contracts</text><text x="330" y="24" fill="#5a6370">protobuf, gRPC</text><rect x="560" y="10" width="140" height="18" rx="9" fill="#ffffff" stroke="#1c57a5"/><text x="630" y="23" text-anchor="middle" font-size="11" fill="#0d2f63">super low effort</text></g>
<g transform="translate(20,176)"><rect width="720" height="38" fill="#f3f5f8"/><text x="12" y="24" fill="#5a6370">A user-facing flow?</text><text x="250" y="24" font-weight="600" fill="#15191f">End to end</text><text x="335" y="24" fill="#5a6370">Playwright, per submodule</text></g>
<g transform="translate(20,218)"><rect width="720" height="38" fill="#f3f5f8"/><text x="12" y="24" fill="#5a6370">A rule for every input?</text><text x="250" y="24" font-weight="600" fill="#15191f">Property-based</text><text x="365" y="24" fill="#5a6370">Hypothesis, fast-check</text><rect x="560" y="10" width="140" height="18" rx="9" fill="#1c57a5"/><text x="630" y="23" text-anchor="middle" font-size="11" fill="#ffffff">agents transforming it</text></g>
<g transform="translate(20,260)"><rect width="720" height="38" fill="#f3f5f8"/><text x="12" y="24" fill="#5a6370">Do the tests check it?</text><text x="250" y="24" font-weight="600" fill="#15191f">Mutation</text><rect x="560" y="10" width="140" height="18" rx="9" fill="#1c57a5"/><text x="630" y="23" text-anchor="middle" font-size="11" fill="#ffffff">agents transforming it</text></g>
<g transform="translate(20,302)"><rect width="720" height="38" fill="#f3f5f8"/><text x="12" y="24" fill="#5a6370">Potential to crash?</text><text x="250" y="24" font-weight="600" fill="#15191f">Sanitizers and fuzzing</text><rect x="410" y="10" width="140" height="18" rx="9" fill="#ffffff" stroke="#1c57a5"/><text x="480" y="23" text-anchor="middle" font-size="11" fill="#0d2f63">super low effort</text><rect x="560" y="10" width="140" height="18" rx="9" fill="#1c57a5"/><text x="630" y="23" text-anchor="middle" font-size="11" fill="#ffffff">agents transforming it</text></g>
<g transform="translate(20,344)"><rect width="720" height="38" fill="#f3f5f8"/><text x="12" y="24" fill="#5a6370">Small, critical section?</text><text x="250" y="24" font-weight="600" fill="#15191f">Symbolic, concolic</text><text x="390" y="24" fill="#5a6370">CrossHair, KLEE</text><rect x="560" y="10" width="140" height="18" rx="9" fill="#1c57a5"/><text x="630" y="23" text-anchor="middle" font-size="11" fill="#ffffff">agents transforming it</text></g>
<g transform="translate(20,386)"><rect width="720" height="38" fill="#f3f5f8"/><text x="12" y="24" fill="#5a6370">Can't go wrong, small?</text><text x="250" y="24" font-weight="600" fill="#15191f">Formal verification</text><rect x="560" y="10" width="140" height="18" rx="9" fill="#1c57a5"/><text x="630" y="23" text-anchor="middle" font-size="11" fill="#ffffff">agents transforming it</text></g>
</g>
<line x1="10" y1="96" x2="10" y2="420" stroke="#1c57a5" stroke-width="2"/>
<text x="20" y="450" font-size="12" fill="#5a6370">Cheaper and broader at the top; more rigorous and narrower at the bottom. Tags as Dev labelled them.</text>
</svg>