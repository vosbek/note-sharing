<svg width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, sans-serif">
<title id="d1t">Red, Green, Refactor, Whitebox loop</title>
<desc id="d1d">Brownfield code first goes through backfill to pin current behavior. Then each change loops through four phases: Red, where human and agent align on failing plain-English tests; Green, where the agent implements and may add but never delete tests; Refactor, where the suite is the safety net; and Whitebox, where the agent writes green tests for incidental behavior. If the human disagrees with a whitebox test, the loop returns to Red.</desc>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15191f"/></marker></defs>
<rect x="10" y="110" width="130" height="80" fill="#f3f5f8" stroke="#5a6370"/>
<text x="75" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#15191f">Backfill</text>
<text x="75" y="160" text-anchor="middle" font-size="11.5" fill="#5a6370">brownfield only:</text>
<text x="75" y="176" text-anchor="middle" font-size="11.5" fill="#5a6370">pin today’s behavior</text>
<path d="M140,150 L170,150 L170,67 L196,67" stroke="#15191f" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>
<rect x="200" y="20" width="230" height="95" fill="#ffffff" stroke="#1c57a5" stroke-width="2"/>
<text x="215" y="45" font-size="15" font-weight="600" fill="#1c57a5">1 Red*</text>
<text x="215" y="66" font-size="12" fill="#15191f">Human and agent align on the what.</text>
<text x="215" y="83" font-size="12" fill="#15191f">A whole set of failing plain-English</text>
<text x="215" y="100" font-size="12" fill="#15191f">scenarios. Human approves.</text>
<rect x="510" y="20" width="230" height="95" fill="#ffffff" stroke="#1c57a5" stroke-width="2"/>
<text x="525" y="45" font-size="15" font-weight="600" fill="#1c57a5">2 Green</text>
<text x="525" y="66" font-size="12" fill="#15191f">Agent implements. It may add tests,</text>
<text x="525" y="83" font-size="12" fill="#15191f">never delete or edit approved ones.</text>
<text x="525" y="100" font-size="12" fill="#15191f">Stop if thrashing.</text>
<rect x="510" y="185" width="230" height="95" fill="#ffffff" stroke="#1c57a5" stroke-width="2"/>
<text x="525" y="210" font-size="15" font-weight="600" fill="#1c57a5">3 Refactor</text>
<text x="525" y="231" font-size="12" fill="#15191f">Clean the implementation.</text>
<text x="525" y="248" font-size="12" fill="#15191f">The suite is the safety net.</text>
<rect x="200" y="185" width="230" height="95" fill="#e8eff9" stroke="#0d2f63" stroke-width="2"/>
<text x="215" y="210" font-size="15" font-weight="600" fill="#0d2f63">4 Whitebox</text>
<text x="215" y="231" font-size="12" fill="#15191f">Agent reads the code, writes green</text>
<text x="215" y="248" font-size="12" fill="#15191f">tests for incidental behavior.</text>
<text x="215" y="265" font-size="12" fill="#15191f">Human reviews them.</text>
<line x1="430" y1="67" x2="506" y2="67" stroke="#15191f" stroke-width="1.5" marker-end="url(#a1)"/>
<line x1="625" y1="115" x2="625" y2="181" stroke="#15191f" stroke-width="1.5" marker-end="url(#a1)"/>
<line x1="510" y1="232" x2="434" y2="232" stroke="#15191f" stroke-width="1.5" marker-end="url(#a1)"/>
<path d="M315,185 L315,119" stroke="#1c57a5" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a1)"/>
<text x="322" y="157" font-size="11.5" fill="#1c57a5">disagree with a green test:</text>
<text x="322" y="172" font-size="11.5" fill="#1c57a5">back to red</text>
</svg>