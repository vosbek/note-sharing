<svg width="940" height="456" class="cn-grid-wide" viewBox="0 0 940 456" role="img" aria-labelledby="mx-t mx-d" xmlns="http://www.w3.org/2000/svg" font-family="Mona Sans Variable, Mona Sans, Arial, sans-serif" font-size="12.5">
<title id="mx-t">Themes by talk</title>
<desc id="mx-d">A grid of eight themes against the twenty talks. Filled squares mark a theme that was central to the talk, outlined squares a theme the talk touched. Harness design: central to Opening keynote, IBM, Lucidic, Cosmos; touched by Uber, Atomic, Roblox, Pinterest, OpenAI, Netflix SDLC, Capital Group, Forter. Code review at volume: central to Atomic, Roblox, Cosmos, OpenAI, Netflix SDLC, Forter, Aviator; touched by Opening keynote, IBM, Uber, Labyrinth, Pinterest. Verification: central to Roblox, Labyrinth, Lucidic, OpenAI, Capital Group, Forter, Aviator; touched by Opening keynote, IBM, Uber, Netflix UDA, Atomic, Pinterest, Cosmos, LinkedIn, Netflix SDLC, Ro. Context and retrieval: central to Uber, Netflix UDA, Roblox, Lucidic, Pinterest, LinkedIn, Netflix SDLC; touched by Opening keynote, IBM, Atomic, Cosmos, OpenAI, Legacy as Leverage, Capital Group, Aviator. Isolation and permissions: central to Opening keynote, Netflix UDA, Atomic, OpenAI; touched by IBM, Roblox, Pinterest, Cosmos, Capital Group. Cost and value: central to Uber, Roblox, LinkedIn; touched by IBM, Atomic, Adobe, Lucidic, Cosmos, OpenAI, Legacy as Leverage, Capital Group, Forter. Change provenance: central to Atomic, Roblox, Capital Group, Aviator; touched by Uber, Netflix UDA, Labyrinth, Cosmos, OpenAI, Netflix SDLC. People and adoption: central to Adobe, Pinterest, Bravely, Legacy as Leverage; touched by OpenAI, Aviator, Ro.</desc>
