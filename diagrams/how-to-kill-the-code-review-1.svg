<svg width="780" height="250" viewBox="0 0 780 250" role="img" aria-labelledby="flow-t flow-d" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, sans-serif"><title id="flow-t">The new shape of review: six verbs</title><desc id="flow-d">Six steps left to right: Argue, Capture, Codify, Prove, Debate, Own. The first four are done mostly by agents and deterministic checks; Debate is done by people; Own is the team. Under each step, the human role.</desc><text x="12" y="18" font-size="12" fill="#5a6370" letter-spacing="1">AGENTS AND CHECKS DO THE WORK</text><text x="524" y="18" font-size="12" fill="#0d2f63" letter-spacing="1">PEOPLE DO THE WORK</text><rect x="12" y="30" width="116" height="78" fill="#ffffff" stroke="#d8dde4" stroke-width="1.5"/><text x="22" y="52" font-size="11" fill="#5a6370">1</text><text x="22" y="76" font-size="17" font-weight="600" fill="#15191f">Argue</text><text x="22" y="96" font-size="11" fill="#5a6370">agents argue first</text><path d="M129 69 L138 69" stroke="#5a6370" stroke-width="1.5"/><path d="M134 65 L139 69 L134 73" fill="none" stroke="#5a6370" stroke-width="1.5"/><line x1="70.0" y1="108" x2="70.0" y2="126" stroke="#d8dde4" stroke-width="1.5"/><text x="70.0" y="144" font-size="11.5" text-anchor="middle" fill="#15191f">People settle what</text><text x="70.0" y="159" font-size="11.5" text-anchor="middle" fill="#15191f">agents can’t</text><rect x="140" y="30" width="116" height="78" fill="#ffffff" stroke="#d8dde4" stroke-width="1.5"/><text x="150" y="52" font-size="11" fill="#5a6370">2</text><text x="150" y="76" font-size="17" font-weight="600" fill="#15191f">Capture</text><text x="150" y="96" font-size="11" fill="#5a6370">intent + criteria</text><path d="M257 69 L266 69" stroke="#5a6370" stroke-width="1.5"/><path d="M262 65 L267 69 L262 73" fill="none" stroke="#5a6370" stroke-width="1.5"/><line x1="198.0" y1="108" x2="198.0" y2="126" stroke="#d8dde4" stroke-width="1.5"/><text x="198.0" y="144" font-size="11.5" text-anchor="middle" fill="#15191f">Author corrects</text><text x="198.0" y="159" font-size="11.5" text-anchor="middle" fill="#15191f">the draft</text><rect x="268" y="30" width="116" height="78" fill="#ffffff" stroke="#d8dde4" stroke-width="1.5"/><text x="278" y="52" font-size="11" fill="#5a6370">3</text><text x="278" y="76" font-size="17" font-weight="600" fill="#15191f">Codify</text><text x="278" y="96" font-size="11" fill="#5a6370">invariants</text><path d="M385 69 L394 69" stroke="#5a6370" stroke-width="1.5"/><path d="M390 65 L395 69 L390 73" fill="none" stroke="#5a6370" stroke-width="1.5"/><line x1="326.0" y1="108" x2="326.0" y2="126" stroke="#d8dde4" stroke-width="1.5"/><text x="326.0" y="144" font-size="11.5" text-anchor="middle" fill="#15191f">Team approves and</text><text x="326.0" y="159" font-size="11.5" text-anchor="middle" fill="#15191f">owns rules</text><rect x="396" y="30" width="116" height="78" fill="#ffffff" stroke="#d8dde4" stroke-width="1.5"/><text x="406" y="52" font-size="11" fill="#5a6370">4</text><text x="406" y="76" font-size="17" font-weight="600" fill="#15191f">Prove</text><text x="406" y="96" font-size="11" fill="#5a6370">evidence per criterion</text><path d="M513 69 L522 69" stroke="#5a6370" stroke-width="1.5"/><path d="M518 65 L523 69 L518 73" fill="none" stroke="#5a6370" stroke-width="1.5"/><line x1="454.0" y1="108" x2="454.0" y2="126" stroke="#d8dde4" stroke-width="1.5"/><text x="454.0" y="144" font-size="11.5" text-anchor="middle" fill="#15191f">Reviewer checks</text><text x="454.0" y="159" font-size="11.5" text-anchor="middle" fill="#15191f">criteria and</text><text x="454.0" y="174" font-size="11.5" text-anchor="middle" fill="#15191f">evidence</text><rect x="524" y="30" width="116" height="78" fill="#0d2f63" stroke="#1c57a5" stroke-width="1.5"/><text x="534" y="52" font-size="11" fill="#b9cdee">5</text><text x="534" y="76" font-size="17" font-weight="600" fill="#ffffff">Debate</text><text x="534" y="96" font-size="11" fill="#b9cdee">the decisions</text><path d="M641 69 L650 69" stroke="#5a6370" stroke-width="1.5"/><path d="M646 65 L651 69 L646 73" fill="none" stroke="#5a6370" stroke-width="1.5"/><line x1="582.0" y1="108" x2="582.0" y2="126" stroke="#d8dde4" stroke-width="1.5"/><text x="582.0" y="144" font-size="11.5" text-anchor="middle" fill="#15191f">Author, reviewer</text><text x="582.0" y="159" font-size="11.5" text-anchor="middle" fill="#15191f">and team</text><rect x="652" y="30" width="116" height="78" fill="#e8eff9" stroke="#1c57a5" stroke-width="1.5"/><text x="662" y="52" font-size="11" fill="#1c57a5">6</text><text x="662" y="76" font-size="17" font-weight="600" fill="#0d2f63">Own</text><text x="662" y="96" font-size="11" fill="#1c57a5">the signature</text><line x1="710.0" y1="108" x2="710.0" y2="126" stroke="#d8dde4" stroke-width="1.5"/><text x="710.0" y="144" font-size="11.5" text-anchor="middle" fill="#15191f">Team owns the</text><text x="710.0" y="159" font-size="11.5" text-anchor="middle" fill="#15191f">rules</text><rect x="12" y="196" width="756" height="46" fill="#f3f5f8"/><text x="24" y="215" font-size="12" fill="#15191f">Line-by-line review stays for auth, payments, migrations and infrastructure.</text><text x="24" y="233" font-size="12" fill="#15191f">The approver signs the intent, the decisions and the evidence, not the diff.</text></svg>