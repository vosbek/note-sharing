<svg width="720" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="obsd2t obsd2d"><title id="obsd2t">From slides 25–27 and her narration</title><desc id="obsd2d">Diagram: the reconciliation loop. Specification (as-designed) and telemetry (as-built) both feed reconciliation, a continuous comparison. Each gap leads to fix the defect or update the specification. A capability that stays reconciled earns autonomy on rung 8; one that drifts loses it.</desc>
<style>.obs2t{font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;fill:#15191f}.obs2tb{font-family:'Source Serif 4',serif;font-size:16px;font-weight:600;fill:#0d2f63}.obs2tw{font-family:'Source Serif 4',serif;font-size:16px;font-weight:600;fill:#fff}.obs2tws{font-family:'IBM Plex Sans',sans-serif;font-size:12px;fill:#e8eff9}.obs2tm{font-family:'IBM Plex Mono',monospace;font-size:10.5px;fill:#5a6370;letter-spacing:.05em}</style>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c57a5"/></marker></defs>
<rect x="20" y="30" width="200" height="110" fill="#f3f5f8" stroke="#d8dde4"/>
<text x="34" y="52" class="obs2tm">AS-DESIGNED</text><text x="34" y="76" class="obs2tb">Specification</text>
<text x="34" y="98" class="obs2t">Services, dependencies, SLOs,</text><text x="34" y="115" class="obs2t">deploy rules; for agents: pinned</text><text x="34" y="132" class="obs2t">prompt, model, tools, autonomy</text>
<rect x="20" y="165" width="200" height="110" fill="#f3f5f8" stroke="#d8dde4"/>
<text x="34" y="187" class="obs2tm">AS-BUILT</text><text x="34" y="211" class="obs2tb">Telemetry</text>
<text x="34" y="233" class="obs2t">Traces, metrics and logs from</text><text x="34" y="250" class="obs2t">the running system: what the</text><text x="34" y="267" class="obs2t">agent actually did</text>
<rect x="270" y="95" width="190" height="115" fill="#0d2f63"/>
<text x="285" y="118" class="obs2tm" style="fill:#c9d6ea">OBSERVABILITY</text><text x="285" y="142" class="obs2tw">Reconciliation</text>
<text x="285" y="164" class="obs2tws">Continuous comparison.</text><text x="285" y="181" class="obs2tws">Not a dashboard: the step that</text><text x="285" y="198" class="obs2tws">keeps design and reality honest</text>
<path d="M220 85 C 245 85, 250 120, 268 128" fill="none" stroke="#1c57a5" stroke-width="1.8" marker-end="url(#a2)"/>
<path d="M220 220 C 245 220, 250 185, 268 178" fill="none" stroke="#1c57a5" stroke-width="1.8" marker-end="url(#a2)"/>
<rect x="510" y="30" width="190" height="62" fill="#fff" stroke="#1c57a5"/>
<text x="524" y="54" class="obs2t" style="font-weight:600">Production is wrong</text><text x="524" y="74" class="obs2t">Detect and fix the defect</text>
<rect x="510" y="112" width="190" height="62" fill="#fff" stroke="#1c57a5"/>
<text x="524" y="136" class="obs2t" style="font-weight:600">The spec is out of date</text><text x="524" y="156" class="obs2t">Update the specification</text>
<rect x="510" y="194" width="190" height="81" fill="#e8eff9" stroke="#c9d6ea"/>
<text x="524" y="216" class="obs2tm" style="fill:#0d2f63">RUNG 8 EVIDENCE</text>
<text x="524" y="238" class="obs2t">Reconciled: earns autonomy</text><text x="524" y="257" class="obs2t">Drifts: loses it</text>
<path d="M460 125 L 506 64" fill="none" stroke="#1c57a5" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M460 145 L 506 143" fill="none" stroke="#1c57a5" stroke-width="1.5" marker-end="url(#a2)"/>
<path d="M460 175 L 506 228" fill="none" stroke="#1c57a5" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="20" y="295" class="obs2tm">WHAT YOU CAN'T AFFORD IS NOT KNOWING THE GAP EXISTS</text>
</svg>