<svg width="760" height="330" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, sans-serif">
<title id="d4t">Anatomy of a Telem test run</title>
<desc id="d4d">A Gherkin scenario drives the real application through its entry point inside one process. Given steps seed fakes through the World, which gives each scenario a unique ID. The real middleware, handlers, retries and caches run unchanged. Only outbound IO is replaced by in-memory fakes for the database, HTTP, the message broker, feature flags, and the clock and UUIDs. Then steps claim each effect with takeOwnershipOf. An After hook fails the scenario if any effect was left unclaimed. A network guard refuses any real outbound connection, and the strict flag fake throws on an undeclared flag. Outside the suite, parity tests run the same cases against each fake and the real service in containers, and the permutation runner runs each feature file under every combination of its declared flags.</desc>
<defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15191f"/></marker></defs>
<rect x="10" y="20" width="190" height="150" fill="#ffffff" stroke="#1c57a5" stroke-width="2"/>
<text x="22" y="42" font-size="13" font-weight="600" fill="#1c57a5">Gherkin scenario</text>
<text x="22" y="64" font-size="11.5" font-family="IBM Plex Mono, monospace">Given … (seed fakes,</text>
<text x="22" y="80" font-size="11.5" font-family="IBM Plex Mono, monospace">  set flags, fail ops)</text>
<text x="22" y="100" font-size="11.5" font-family="IBM Plex Mono, monospace">When … (one trigger)</text>
<text x="22" y="120" font-size="11.5" font-family="IBM Plex Mono, monospace">Then … [io-name]</text>
<text x="22" y="136" font-size="11.5" font-family="IBM Plex Mono, monospace">  takeOwnershipOf*</text>
<text x="22" y="158" font-size="11" fill="#5a6370">World: scenario ID</text>
<line x1="200" y1="95" x2="246" y2="95" stroke="#15191f" stroke-width="1.5" marker-end="url(#a4)"/>
<rect x="250" y="20" width="230" height="150" fill="#f3f5f8" stroke="#5a6370"/>
<text x="262" y="42" font-size="13" font-weight="600">Real application, unchanged</text>
<text x="262" y="64" font-size="11.5">entry point only (HTTP via supertest,</text>
<text x="262" y="80" font-size="11.5">consumer handler, cron)</text>
<text x="262" y="102" font-size="11.5">middleware, routing, validation,</text>
<text x="262" y="118" font-size="11.5">retries, caching, fallbacks:</text>
<text x="262" y="134" font-size="11.5">business logic, never faked</text>
<line x1="480" y1="95" x2="526" y2="95" stroke="#15191f" stroke-width="1.5" marker-end="url(#a4)"/>
<text x="484" y="86" font-size="10" fill="#5a6370">outbound</text>
<text x="484" y="112" font-size="10" fill="#5a6370">ports</text>
<rect x="530" y="20" width="220" height="150" fill="#ffffff" stroke="#0d2f63" stroke-width="2"/>
<text x="542" y="42" font-size="13" font-weight="600" fill="#0d2f63">In-memory fakes</text>
<text x="542" y="62" font-size="11.5">database repositories</text>
<text x="542" y="78" font-size="11.5">HTTP out (fetch)</text>
<text x="542" y="94" font-size="11.5">message broker (Kafka)</text>
<text x="542" y="110" font-size="11.5">feature flags (strict)</text>
<text x="542" y="126" font-size="11.5">clock, timers, UUIDs</text>
<text x="542" y="148" font-size="10.5" fill="#5a6370" font-family="IBM Plex Mono, monospace">seed · fail · takeOwnershipOf</text>
<text x="542" y="162" font-size="10.5" fill="#5a6370" font-family="IBM Plex Mono, monospace">throwIfUnownedExist · cleanup</text>
<rect x="10" y="200" width="230" height="56" fill="#e8eff9" stroke="#1c57a5"/>
<text x="22" y="222" font-size="12" font-weight="600">After hook safety net</text>
<text x="22" y="242" font-size="11">any unclaimed effect fails the scenario</text>
<rect x="265" y="200" width="230" height="56" fill="#e8eff9" stroke="#1c57a5"/>
<text x="277" y="222" font-size="12" font-weight="600">Network guard</text>
<text x="277" y="242" font-size="11">refuses every non-loopback connection</text>
<rect x="520" y="200" width="230" height="56" fill="#e8eff9" stroke="#1c57a5"/>
<text x="532" y="222" font-size="12" font-weight="600">Flag interceptor</text>
<text x="532" y="242" font-size="11">undeclared flag read throws</text>
<rect x="10" y="272" width="355" height="50" fill="#ffffff" stroke="#5a6370" stroke-dasharray="4 3"/>
<text x="22" y="292" font-size="12" font-weight="600">Parity tests (separate suite)</text>
<text x="22" y="310" font-size="11">same cases against each fake and the real service in Docker</text>
<rect x="395" y="272" width="355" height="50" fill="#ffffff" stroke="#5a6370" stroke-dasharray="4 3"/>
<text x="407" y="292" font-size="12" font-weight="600">Flag permutation runner</text>
<text x="407" y="310" font-size="11">2^N runs per feature file from flag-manifest.json</text>
</svg>