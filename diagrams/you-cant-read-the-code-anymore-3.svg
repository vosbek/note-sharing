<svg width="760" height="360" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, sans-serif">
<title id="d3t">The 20-step backfill-tests pipeline for one business flow</title>
<desc id="d3d">Steps 1 to 6 build the first scenarios: read flow, fill fakes, happy path, error and edge cases, optional properties, discrete mappings. An outer loop of steps 7 to 13 then runs checkers: decision table, declare flags, test configs, an inner coverage loop of steps 10 and 11 that repeats while coverable branches remain, protocol issues, and a self-audit that sends the flow back to step 7 if anything changed. Step 14, a blind test by a fresh subagent, runs once and can send survivors back to step 7. Steps 15 to 20 finish: flag permutations, peer review, retrospective, apply lessons to earlier flows, refactor, and the walkthrough reviewed by a human.</desc>
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15191f"/></marker></defs>
<g font-size="11.5">
<text x="10" y="18" font-size="11" fill="#5a6370" letter-spacing="0.06em">FIRST SCENARIOS</text>
<rect x="10" y="26" width="112" height="40" fill="#ffffff" stroke="#1c57a5"/><text x="66" y="50" text-anchor="middle">1 read-flow</text>
<rect x="136" y="26" width="112" height="40" fill="#ffffff" stroke="#1c57a5"/><text x="192" y="50" text-anchor="middle">2 fill-fakes</text>
<rect x="262" y="26" width="112" height="40" fill="#ffffff" stroke="#1c57a5"/><text x="318" y="50" text-anchor="middle">3 happy-path</text>
<rect x="388" y="26" width="112" height="40" fill="#ffffff" stroke="#1c57a5"/><text x="444" y="44" text-anchor="middle">4 error and</text><text x="444" y="58" text-anchor="middle">edge cases</text>
<rect x="514" y="26" width="112" height="40" fill="#ffffff" stroke="#1c57a5"/><text x="570" y="44" text-anchor="middle">5 optional</text><text x="570" y="58" text-anchor="middle">properties</text>
<rect x="640" y="26" width="112" height="40" fill="#ffffff" stroke="#1c57a5"/><text x="696" y="44" text-anchor="middle">6 discrete</text><text x="696" y="58" text-anchor="middle">mappings</text>
<line x1="122" y1="46" x2="134" y2="46" stroke="#15191f" marker-end="url(#a3)"/><line x1="248" y1="46" x2="260" y2="46" stroke="#15191f" marker-end="url(#a3)"/><line x1="374" y1="46" x2="386" y2="46" stroke="#15191f" marker-end="url(#a3)"/><line x1="500" y1="46" x2="512" y2="46" stroke="#15191f" marker-end="url(#a3)"/><line x1="626" y1="46" x2="638" y2="46" stroke="#15191f" marker-end="url(#a3)"/>
<path d="M696,66 L696,84 L66,84 L66,126" stroke="#15191f" fill="none" marker-end="url(#a3)"/>
<rect x="6" y="96" width="748" height="132" fill="#f3f5f8" stroke="#5a6370" stroke-dasharray="4 3"/>
<text x="14" y="221" font-size="11" fill="#5a6370" letter-spacing="0.06em">OUTER LOOP 7–13: CHECKERS</text>
<rect x="14" y="130" width="104" height="40" fill="#ffffff" stroke="#0d2f63"/><text x="66" y="148" text-anchor="middle">7 decision</text><text x="66" y="162" text-anchor="middle">table</text>
<rect x="132" y="130" width="96" height="40" fill="#ffffff" stroke="#0d2f63"/><text x="180" y="148" text-anchor="middle">8 declare</text><text x="180" y="162" text-anchor="middle">flags</text>
<rect x="242" y="130" width="96" height="40" fill="#ffffff" stroke="#0d2f63"/><text x="290" y="148" text-anchor="middle">9 test</text><text x="290" y="162" text-anchor="middle">configs</text>
<rect x="352" y="112" width="200" height="104" fill="#e8eff9" stroke="#1c57a5"/>
<text x="360" y="128" font-size="10.5" fill="#1c57a5">INNER LOOP, subagent per pass</text>
<rect x="362" y="136" width="84" height="40" fill="#ffffff" stroke="#1c57a5"/><text x="404" y="154" text-anchor="middle">10 coverage</text><text x="404" y="168" text-anchor="middle">tool</text>
<rect x="458" y="136" width="86" height="40" fill="#ffffff" stroke="#1c57a5"/><text x="501" y="154" text-anchor="middle">11 coverage</text><text x="501" y="168" text-anchor="middle">accounting</text>
<line x1="446" y1="150" x2="456" y2="150" stroke="#15191f" marker-end="url(#a3)"/>
<path d="M501,176 L501,196 L404,196 L404,180" stroke="#1c57a5" fill="none" marker-end="url(#a3)"/>
<text x="412" y="210" font-size="10" fill="#1c57a5">coverable branches left</text>
<rect x="566" y="130" width="84" height="40" fill="#ffffff" stroke="#0d2f63"/><text x="608" y="148" text-anchor="middle">12 protocol</text><text x="608" y="162" text-anchor="middle">issues</text>
<rect x="662" y="130" width="84" height="40" fill="#ffffff" stroke="#0d2f63"/><text x="704" y="148" text-anchor="middle">13 self-</text><text x="704" y="162" text-anchor="middle">audit</text>
<line x1="118" y1="150" x2="130" y2="150" stroke="#15191f" marker-end="url(#a3)"/><line x1="228" y1="150" x2="240" y2="150" stroke="#15191f" marker-end="url(#a3)"/><line x1="338" y1="150" x2="360" y2="150" stroke="#15191f" marker-end="url(#a3)"/><line x1="544" y1="150" x2="564" y2="150" stroke="#15191f" marker-end="url(#a3)"/><line x1="650" y1="150" x2="660" y2="150" stroke="#15191f" marker-end="url(#a3)"/>
<path d="M724,130 L724,110 L96,110 L96,126" stroke="#0d2f63" fill="none" stroke-dasharray="5 4" marker-end="url(#a3)"/>
<text x="566" y="124" font-size="10" fill="#0d2f63">any scenario changed: back to 7</text>
<path d="M704,170 L704,248" stroke="#15191f" fill="none" marker-end="url(#a3)"/>
<rect x="560" y="252" width="190" height="40" fill="#ffffff" stroke="#1c57a5" stroke-width="2"/><text x="655" y="270" text-anchor="middle">14 blind test (once, capped):</text><text x="655" y="284" text-anchor="middle">fresh agent guesses scenarios</text>
<path d="M560,272 L520,272 L520,240 L2,240 L2,150 L12,150" stroke="#1c57a5" fill="none" stroke-dasharray="5 4" marker-end="url(#a3)"/>
<text x="200" y="236" font-size="10" fill="#1c57a5">survivors: one absorption pass from 7</text>
<text x="10" y="318" font-size="11" fill="#5a6370" letter-spacing="0.06em">FINISH</text>
<rect x="10" y="324" width="114" height="32" fill="#ffffff" stroke="#5a6370"/><text x="67" y="344" text-anchor="middle">15 flag perms</text>
<rect x="134" y="324" width="114" height="32" fill="#ffffff" stroke="#5a6370"/><text x="191" y="344" text-anchor="middle">16 peer review</text>
<rect x="258" y="324" width="114" height="32" fill="#ffffff" stroke="#5a6370"/><text x="315" y="344" text-anchor="middle">17 retrospective</text>
<rect x="382" y="324" width="114" height="32" fill="#ffffff" stroke="#5a6370"/><text x="439" y="344" text-anchor="middle">18 apply lessons</text>
<rect x="506" y="324" width="114" height="32" fill="#ffffff" stroke="#5a6370"/><text x="563" y="344" text-anchor="middle">19 refactor</text>
<rect x="630" y="324" width="122" height="32" fill="#e8eff9" stroke="#0d2f63" stroke-width="2"/><text x="691" y="344" text-anchor="middle">20 walkthrough</text>
<path d="M655,292 L655,306 L67,306 L67,320" stroke="#15191f" fill="none" marker-end="url(#a3)"/>
<line x1="124" y1="340" x2="132" y2="340" stroke="#15191f" marker-end="url(#a3)"/><line x1="248" y1="340" x2="256" y2="340" stroke="#15191f" marker-end="url(#a3)"/><line x1="372" y1="340" x2="380" y2="340" stroke="#15191f" marker-end="url(#a3)"/><line x1="496" y1="340" x2="504" y2="340" stroke="#15191f" marker-end="url(#a3)"/><line x1="620" y1="340" x2="628" y2="340" stroke="#15191f" marker-end="url(#a3)"/>
</g>
</svg>