<svg width="780" height="400" viewBox="0 0 780 400" role="img" aria-labelledby="flow-t flow-d" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, sans-serif"><title id="flow-t">Ro’s 2026 intake path, browser to workers</title><desc id="flow-d">In the browser, the existing onboarding flow makes its calls through a request handler layer that blocks unknown calls, sends analytics fire-and-forget, defers phone verification, and bundles the rest into one final payload with two essential calls. On the server, the payload goes to API Gateway and an SQS queue whose replay rate is rate limit one, then through the ingress proxy to the intake processing service, which writes it to the intake database. Workers, whose number is rate limit two, run about 25 idempotent steps and record progress for retries. The production load test went as far as the database write.</desc><text x="12" y="20" font-size="12" fill="#5a6370" letter-spacing="1">IN THE BROWSER</text><rect x="12" y="30" width="756" height="130" fill="#f3f5f8"/><rect x="28" y="46" width="170" height="54" fill="#ffffff" stroke="#d8dde4" stroke-width="1.5"/><text x="113.0" y="70.0" font-size="13" font-weight="600" text-anchor="middle" fill="#15191f">Existing onboarding flow</text><text x="113.0" y="87.0" font-size="10.5" text-anchor="middle" fill="#5a6370">unchanged, still makes ~60 calls</text><rect x="244" y="46" width="210" height="54" fill="#e8eff9" stroke="#1c57a5" stroke-width="1.5"/><text x="349.0" y="70.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0d2f63">Request handler layer</text><text x="349.0" y="87.0" font-size="10.5" text-anchor="middle" fill="#1c57a5">answers the app like a server would</text><path d="M198 73 L242 73" stroke="#5a6370" stroke-width="1.5" fill="none"/><path d="M235.7 76.0 L242 73 L235.7 70.0" stroke="#5a6370" stroke-width="1.5" fill="none"/><rect x="500" y="46" width="252" height="54" fill="#0d2f63" stroke="#0d2f63" stroke-width="1.5"/><text x="626.0" y="70.0" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">One final payload</text><text x="626.0" y="87.0" font-size="10.5" text-anchor="middle" fill="#b9cdee">2 essential calls, in order</text><path d="M454 73 L498 73" stroke="#5a6370" stroke-width="1.5" fill="none"/><path d="M491.7 76.0 L498 73 L491.7 70.0" stroke="#5a6370" stroke-width="1.5" fill="none"/><text x="28" y="122" font-size="11" fill="#15191f">Unknown calls: blocked, reported</text><text x="268" y="122" font-size="11" fill="#15191f">Analytics: fire-and-forget</text><text x="28" y="138" font-size="11" fill="#15191f">Phone check: retried after the visit</text><text x="268" y="138" font-size="11" fill="#15191f">Config and cruft: gone</text><text x="500" y="122" font-size="10.5" fill="#5a6370">Shipped first in shadow mode,</text><text x="500" y="138" font-size="10.5" fill="#5a6370">logging the payload it would have sent.</text><text x="84" y="198" font-size="12" fill="#5a6370" letter-spacing="1">ON THE SERVER</text><rect x="12" y="212" width="118" height="54" fill="#ffffff" stroke="#d8dde4" stroke-width="1.5"/><text x="71.0" y="236.0" font-size="13" font-weight="600" text-anchor="middle" fill="#15191f">API Gateway</text><text x="71.0" y="253.0" font-size="10.5" text-anchor="middle" fill="#5a6370">submit endpoint</text><rect x="152" y="212" width="118" height="54" fill="#ffffff" stroke="#d8dde4" stroke-width="1.5"/><text x="211.0" y="236.0" font-size="13" font-weight="600" text-anchor="middle" fill="#15191f">SQS queue</text><text x="211.0" y="253.0" font-size="10.5" text-anchor="middle" fill="#5a6370">holds the spike</text><rect x="292" y="212" width="118" height="54" fill="#ffffff" stroke="#d8dde4" stroke-width="1.5"/><text x="351.0" y="236.0" font-size="13" font-weight="600" text-anchor="middle" fill="#15191f">Ingress proxy</text><text x="351.0" y="253.0" font-size="10.5" text-anchor="middle" fill="#5a6370">no longer swamped</text><rect x="432" y="212" width="130" height="54" fill="#ffffff" stroke="#d8dde4" stroke-width="1.5"/><text x="497.0" y="236.0" font-size="13" font-weight="600" text-anchor="middle" fill="#15191f">Intake processing</text><text x="497.0" y="253.0" font-size="10.5" text-anchor="middle" fill="#5a6370">writes the payload</text><rect x="588" y="212" width="110" height="54" fill="#ffffff" stroke="#d8dde4" stroke-width="1.5"/><text x="643.0" y="236.0" font-size="13" font-weight="600" text-anchor="middle" fill="#15191f">Intake DB</text><text x="643.0" y="253.0" font-size="10.5" text-anchor="middle" fill="#5a6370">rows for workers</text><path d="M130 239.0 L150 239.0" stroke="#5a6370" stroke-width="1.5" fill="none"/><path d="M143.7 242.0 L150 239.0 L143.7 236.0" stroke="#5a6370" stroke-width="1.5" fill="none"/><path d="M270 239.0 L290 239.0" stroke="#5a6370" stroke-width="1.5" fill="none"/><path d="M283.7 242.0 L290 239.0 L283.7 236.0" stroke="#5a6370" stroke-width="1.5" fill="none"/><path d="M410 239.0 L430 239.0" stroke="#5a6370" stroke-width="1.5" fill="none"/><path d="M423.7 242.0 L430 239.0 L423.7 236.0" stroke="#5a6370" stroke-width="1.5" fill="none"/><path d="M562 239.0 L586 239.0" stroke="#5a6370" stroke-width="1.5" fill="none"/><path d="M579.7 242.0 L586 239.0 L579.7 236.0" stroke="#5a6370" stroke-width="1.5" fill="none"/><path d="M740 100 L740 176 L71 176 L71 200" stroke="#1c57a5" stroke-width="1.5" fill="none"/><path d="M71 196 L71 208" stroke="#1c57a5" stroke-width="1.5" fill="none"/><path d="M68.0 201.7 L71 208 L74.0 201.7" stroke="#1c57a5" stroke-width="1.5" fill="none"/><rect x="167" y="276" width="88" height="22" rx="11" fill="#0d2f63"/><text x="211" y="291" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">Rate limit 1</text><text x="211" y="312" font-size="10.5" text-anchor="middle" fill="#5a6370">queue replay rate</text><rect x="588" y="318" width="180" height="60" fill="#e8eff9" stroke="#1c57a5" stroke-width="1.5"/><text x="678.0" y="345.0" font-size="13" font-weight="600" text-anchor="middle" fill="#0d2f63">Workers</text><text x="678.0" y="362.0" font-size="10.5" text-anchor="middle" fill="#1c57a5">about 25 idempotent steps</text><path d="M643 266 L660 316" stroke="#5a6370" stroke-width="1.5" fill="none"/><path d="M655.1 311.0 L660 316 L660.9 309.1" stroke="#5a6370" stroke-width="1.5" fill="none"/><rect x="476" y="334" width="88" height="22" rx="11" fill="#0d2f63"/><text x="520" y="349" font-size="10.5" font-weight="600" text-anchor="middle" fill="#ffffff">Rate limit 2</text><text x="520" y="370" font-size="10.5" text-anchor="middle" fill="#5a6370">number of workers</text><path d="M710 206 L710 300" stroke="#1c57a5" stroke-width="1.5" stroke-dasharray="4 3"/><text x="716" y="214" font-size="10.5" fill="#1c57a5">prod test</text><text x="716" y="228" font-size="10.5" fill="#1c57a5">stopped</text><text x="716" y="242" font-size="10.5" fill="#1c57a5">here</text><text x="12" y="350" font-size="11.5" fill="#15191f">Throughput = capacity × time. Nobody is waiting on a screen,</text><text x="12" y="367" font-size="11.5" fill="#15191f">so the spike drains at a rate the old systems can take.</text></svg>