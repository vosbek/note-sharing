<rect x="250" y="370" width="200" height="30" fill="#f3f5f8" stroke="#d8dde4"/><text x="260" y="389" class="obs1n" fill="#1c57a5">L1</text><text x="288" y="389" class="obs1t">Tab complete</text>
<rect x="250" y="330" width="200" height="30" fill="#f3f5f8" stroke="#d8dde4"/><text x="260" y="349" class="obs1n" fill="#1c57a5">L2</text><text x="288" y="349" class="obs1t">Agent IDE</text>
<rect x="250" y="290" width="200" height="30" fill="#e8eff9" stroke="#c9d6ea"/><text x="260" y="309" class="obs1n" fill="#1c57a5">L3</text><text x="288" y="309" class="obs1t">Context engineering</text>
<rect x="250" y="250" width="200" height="30" fill="#e8eff9" stroke="#c9d6ea"/><text x="260" y="269" class="obs1n" fill="#1c57a5">L4</text><text x="288" y="269" class="obs1t">Compounding eng.</text>
<rect x="250" y="210" width="200" height="30" fill="#e8eff9" stroke="#c9d6ea"/><text x="260" y="229" class="obs1n" fill="#1c57a5">L5</text><text x="288" y="229" class="obs1t">MCP and skills</text>
<rect x="250" y="170" width="200" height="30" fill="#c9d6ea" stroke="#c9d6ea"/><text x="260" y="189" class="obs1n" fill="#0d2f63">L6</text><text x="288" y="189" class="obs1t">Harness engineering</text>
