<svg width="720" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="obsd1t obsd1d"><title id="obsd1t">From slides 14–17</title><desc id="obsd1d">Diagram: three maturity ladders side by side. Shapiro levels 0 to 5 for the human, Eledath levels 1 to 8 for the system, and Wonnacott's rungs 1 to 8 for the platform, with a dashed platform edge between rungs 4 and 5.</desc>
<style>.obs1t{font-family:'IBM Plex Sans',sans-serif;font-size:12px;fill:#15191f}.obs1tm{font-family:'IBM Plex Mono',monospace;font-size:10.5px;fill:#5a6370;letter-spacing:.04em}.obs1th{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:#0d2f63;letter-spacing:.05em}.obs1tw{font-family:'IBM Plex Sans',sans-serif;font-size:12px;fill:#fff}.obs1n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500}</style>
<text x="20" y="28" class="obs1th">SHAPIRO · THE HUMAN</text>
<text x="250" y="28" class="obs1th">ELEDATH · AROUND THE AGENT</text>
<text x="490" y="28" class="obs1th">WONNACOTT · THE PLATFORM</text>
