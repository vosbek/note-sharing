<rect x="20" y="370" width="190" height="30" fill="#f3f5f8" stroke="#d8dde4"/><text x="30" y="389" class="obs1n" fill="#1c57a5">L1</text><text x="58" y="389" class="obs1t">Assisted</text>
<rect x="20" y="330" width="190" height="30" fill="#f3f5f8" stroke="#d8dde4"/><text x="30" y="349" class="obs1n" fill="#1c57a5">L2</text><text x="58" y="349" class="obs1t">Paired</text>
<rect x="20" y="210" width="190" height="110" fill="#e8eff9" stroke="#c9d6ea"/><text x="30" y="269" class="obs1n" fill="#1c57a5">L3</text><text x="58" y="269" class="obs1t">Supervised: you review</text>
<rect x="20" y="130" width="190" height="70" fill="#c9d6ea" stroke="#c9d6ea"/><text x="30" y="169" class="obs1n" fill="#0d2f63">L4</text><text x="58" y="169" class="obs1t">Autonomous</text>
<rect x="20" y="90" width="190" height="30" fill="#0d2f63"/><text x="30" y="109" class="obs1n" fill="#fff">L5</text><text x="58" y="109" class="obs1tw">Dark factory</text>
</g>
