<line x1="470" y1="235" x2="710" y2="235" stroke="#0d2f63" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="705" y="231" text-anchor="end" class="obs1tm" style="fill:#0d2f63">PLATFORM EDGE</text>
<text x="478" y="250" class="obs1tm" transform="rotate(-90 478 250)" text-anchor="end">BUILD SIDE</text>
<text x="478" y="222" class="obs1tm" transform="rotate(-90 478 222)">AGENT AS PLATFORM USER</text>
<text x="20" y="462" class="obs1tm">Shapiro scales the human. Eledath scales what's built around the agent. Neither reaches the platform.</text>
